<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Edge | Secure Encryption</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .video-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: #000;
        }
        
        .bg-video { 
            width: 100%; height: 100%; 
            object-fit: cover; /* لضمان ملء الشاشة بدون فراغات */
        }

        .content { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            text-align: center; color: white; width: 85%;
            background: rgba(0, 0, 0, 0.5); padding: 30px; border-radius: 20px;
            backdrop-filter: blur(5px); /* لمسة جمالية ضبابية */
        }
        
        .btn { 
            padding: 15px 40px; background: #00f2ff; color: #000; 
            text-decoration: none; font-weight: bold; border-radius: 50px; 
            display: inline-block; margin-top: 20px; transition: 0.3s;
        }
        
        .btn:hover { background: #fff; transform: scale(1.05); }

        /* تعديلات للهواتف */
        @media (max-width: 768px) {
            .content { width: 90%; padding: 20px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video autoplay muted loop playsinline class="bg-video">
